["Un rey moderniza caminos y escuelas, pero no permite que el pueblo opine ni elija. Esto es…",["despotismo ilustrado","república democrática","monarquía constitucional","liberalismo"],0,"Reformas desde arriba sin soberanía popular."],
["Campesinos, artesanos y burgueses franceses formaban el…",["primer estado","segundo estado","tercer estado","clero"],2,"Eran la mayoría y cargaban los impuestos."],

{t:"2. La caída del Antiguo Régimen y las etapas de la Revolución",s:"Panorama Mundial 9, pp. 151-154 · Presentación VGP-2",

["La invasión de Napoleón a España provocó en las colonias…",["un vacío de poder y juntas de gobierno","más control español","el fin de la Ilustración","la unión con Inglaterra"],0,"Abrió espacio a los movimientos autonomistas."],
